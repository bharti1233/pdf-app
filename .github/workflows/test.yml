name: Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Run static analysis
        run: |
          chmod +x scripts/static_analysis.sh
          bash scripts/static_analysis.sh
          
      - name: Run Android Lint
        run: chmod +x gradlew && ./gradlew lintFdroidDebug --continue
        
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}

      - name: Run unit tests
        run: chmod +x gradlew && ./gradlew testFdroidDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
          
      - name: Build fdroid debug
        run: chmod +x gradlew && ./gradlew :app:assembleFdroidDebug
        
      - name: Build playstore debug
        run: chmod +x gradlew && ./gradlew :app:assemblePlaystoreDebug

  crash-free-check:
    name: Crash Pattern Check
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - name: Check for known crash patterns
        run: |
          echo "Checking BaseCanvas crash patterns..."
          # Fail if any Canvas construction lacks recycle guard
          if grep -rn "Canvas(bitmap)" app/src/main --include="*.kt" | \
             grep -v "isRecycled\|//"; then
            echo "ERROR: Unguarded Canvas construction found"
            exit 1
          fi
          
          echo "Checking OOM patterns in heavy operations..."
          if grep -rn "Bitmap.createBitmap" app/src/main --include="*.kt" | \
             grep -l "for\|forEach\|map" | \
             xargs grep -L "OutOfMemoryError" 2>/dev/null; then
            echo "WARNING: Bitmap creation in loop without OOM catch"
          fi
          
          echo "Crash pattern check complete"

  release-apk-build:
    # PRODUCTION signing is temporarily disabled for this CI iteration.
    # This job is kept intact but never scheduled; re-enable by removing
    # the `if: false` guard and restoring the four signing secrets.
    if: false
    name: Release APK Build (signed, direct distribution)
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}

      # Signing config is read from: system property CI=true plus
      # ANDROID_KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
      # This mirrors .github/workflows/deploy.yml. Missing secrets must FAIL,
      # never produce a misleading unsigned APK.
      - name: Verify signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "ERROR: Missing signing secrets (ANDROID_KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD)."
            echo "       The release APK CANNOT be signed without them. Refusing to upload an unsigned APK."
            exit 1
          fi
          echo "All signing secrets present."

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cp keystore.jks app/keystore.jks

      - name: Build release opensource APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: keystore.jks
          CI: true
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOpensourceRelease --continue

      - name: Locate APK
        run: |
          set -e
          APK_DIR=app/build/outputs/apk/opensource/release
          echo "Checking for APK output in $APK_DIR..."
          ls -lh "$APK_DIR"
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: opensource release build completed, but no APK was found at the expected output location ($APK_DIR)."
            exit 1
          fi
          echo "APK path: $APK_FILE"
          echo "APK filename: $(basename $APK_FILE)"
          echo "APK size: $(stat -c%s $APK_FILE) bytes"
          unzip -t "$APK_FILE" > /dev/null || { echo "ERROR: APK is not a valid ZIP archive"; exit 1; }
          echo "APK passes ZIP integrity check"

      - name: Verify APK signature and metadata
        run: |
          set -e
          APK_DIR=app/build/outputs/apk/opensource/release
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "== ZIP integrity =="
          unzip -t "$APK_FILE" > /dev/null
          echo "== aapt badging =="
          $AAPT dump badging "$APK_FILE" | head -5
          echo "== apksigner verify --verbose --print-certs =="
          $APKSIGNER verify --verbose --print-certs "$APK_FILE"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-release-apk
          path: app/build/outputs/apk/opensource/release/*.apk
          if-no-files-found: error
          retention-days: 7

  debug-apk-build:
    name: Debug APK Build (installable, debug-signed)
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}

      - name: Build opensource debug APK (Android debug signing)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOpensourceDebug --continue

      - name: Locate debug APK
        run: |
          set -e
          APK_DIR=app/build/outputs/apk/opensource/debug
          echo "Checking for APK output in $APK_DIR..."
          ls -lh "$APK_DIR"
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: opensource debug build completed, but no APK was found at the expected output location ($APK_DIR)."
            exit 1
          fi
          echo "APK path: $APK_FILE"
          echo "APK filename: $(basename $APK_FILE)"
          echo "APK size: $(stat -c%s $APK_FILE) bytes"
          unzip -t "$APK_FILE" > /dev/null || { echo "ERROR: APK is not a valid ZIP archive"; exit 1; }
          echo "APK passes ZIP integrity check"

      - name: Verify APK signature and metadata
        run: |
          set -e
          APK_DIR=app/build/outputs/apk/opensource/debug
          APK_FILE=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -1)
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "== ZIP integrity =="
          unzip -t "$APK_FILE" > /dev/null
          echo "== aapt badging =="
          $AAPT dump badging "$APK_FILE" | head -5
          echo "== apksigner verify --verbose --print-certs =="
          $APKSIGNER verify --verbose --print-certs "$APK_FILE"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-debug-apk
          path: app/build/outputs/apk/opensource/debug/*.apk
          if-no-files-found: error
          retention-days: 7

